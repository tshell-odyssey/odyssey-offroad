# ============================================================
# ODYSSEY OFF-ROAD — Netlify Configuration
# odysseyoffroad.com
#
# ── COMING SOON MODE — ACTIVE ──
# The real site (index.html, trailers.html, our-story.html, etc.)
# stays in the repo untouched and in development. Publicly, every
# route — including the root "/" — redirects to /coming-soon, so
# that's the only page visitors can actually see.
#
# TO LAUNCH THE FULL SITE LATER:
#   1. Delete the "COMING SOON MODE" redirect block below
#   2. Uncomment the "CLEAN URLs" block below
#   3. Restore the 404 handler to point back to /index.html
# ============================================================

[build]
  publish = "."

# ── COMING SOON MODE (active) ──
# Clean URL for the coming-soon page itself.
[[redirects]]
  from = "/coming-soon"
  to   = "/coming-soon.html"
  status = 200

# Root and every real-site route redirect to /coming-soon.
[[redirects]]
  from = "/"
  to   = "/coming-soon"
  status = 302

[[redirects]]
  from = "/index.html"
  to   = "/coming-soon"
  status = 302

[[redirects]]
  from = "/our-story*"
  to   = "/coming-soon"
  status = 302

[[redirects]]
  from = "/build-progress*"
  to   = "/coming-soon"
  status = 302

[[redirects]]
  from = "/trailers*"
  to   = "/coming-soon"
  status = 302

[[redirects]]
  from = "/field-notes*"
  to   = "/coming-soon"
  status = 302

[[redirects]]
  from = "/contact*"
  to   = "/coming-soon"
  status = 302

[[redirects]]
  from = "/posts/*"
  to   = "/coming-soon"
  status = 302

# ── CLEAN URLs (removes .html from browser address bar) ──
# Restore these (and delete the "COMING SOON MODE" block above) when you launch the full site.
# [[redirects]]
#   from = "/our-story"
#   to   = "/our-story.html"
#   status = 200
#
# [[redirects]]
#   from = "/build-progress"
#   to   = "/build-progress.html"
#   status = 200
#
# [[redirects]]
#   from = "/trailers"
#   to   = "/trailers.html"
#   status = 200
#
# [[redirects]]
#   from = "/field-notes"
#   to   = "/field-notes.html"
#   status = 200
#
# [[redirects]]
#   from = "/contact"
#   to   = "/contact.html"
#   status = 200
#
# [[redirects]]
#   from = "/posts/:slug"
#   to   = "/posts/:slug.html"
#   status = 200

# ── 404 HANDLER ──
# While in coming-soon mode, unknown routes fall through to /coming-soon (see catch-all above).
# When you launch the full site, change "to" back to "/index.html".
[[redirects]]
  from   = "/*"
  to     = "/coming-soon"
  status = 404

# ── SECURITY HEADERS ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── CACHE HEADERS for static assets ──
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── FORM NOTIFICATIONS ──
# Configure in Netlify Dashboard → Forms → [form name] → Notifications
# Notification emails: info@odysseyoffroad.com

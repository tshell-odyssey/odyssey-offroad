# ============================================================
# ODYSSEY OFF-ROAD — Netlify Configuration (DEV BRANCH ONLY)
# This file belongs on the "dev" branch, NOT on "main".
#
# Unlike the production config (which forces every route to
# /coming-soon), this version serves the full site normally —
# real homepage, trailers, our-story, etc. — with clean URLs.
#
# This lets you preview the in-progress site at its Netlify
# branch-deploy URL (something like dev--odysseyoffroad.netlify.app)
# without exposing it on your live custom domain, which stays on
# the "main" branch's coming-soon-only config.
# ============================================================

[build]
  publish = "."

# ── CLEAN URLs (removes .html from browser address bar) ──
[[redirects]]
  from = "/our-story"
  to   = "/our-story.html"
  status = 200

[[redirects]]
  from = "/build-progress"
  to   = "/build-progress.html"
  status = 200

[[redirects]]
  from = "/trailers"
  to   = "/trailers.html"
  status = 200

[[redirects]]
  from = "/field-notes"
  to   = "/field-notes.html"
  status = 200

[[redirects]]
  from = "/contact"
  to   = "/contact.html"
  status = 200

[[redirects]]
  from = "/coming-soon"
  to   = "/coming-soon.html"
  status = 200

[[redirects]]
  from = "/posts/:slug"
  to   = "/posts/:slug.html"
  status = 200

# ── 404 HANDLER ──
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404

# ── SECURITY HEADERS ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── CACHE HEADERS for static assets ──
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── FORM NOTIFICATIONS ──
# Configure in Netlify Dashboard → Forms → [form name] → Notifications
# Notification emails: info@odysseyoffroad.com
